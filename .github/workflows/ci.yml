name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: abcdefghijklmnopqrstuvwxyz1234567890
      ENVIRONMENT: development
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt -r requirements-test.txt

      - name: Compile Backend
        run: |
          python -m compileall app

      - name: Run Pytest
        run: |
          python -m pytest -q tests

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'AI Call Center Platform/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: './AI Call Center Platform'
        run: npm ci

      - name: Run Vitest
        working-directory: './AI Call Center Platform'
        run: npm run test

      - name: Build Frontend
        working-directory: './AI Call Center Platform'
        run: npm run build
