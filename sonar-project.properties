sonar.projectKey=voic-call-rating
sonar.projectName=Voice Call Rating Platform
sonar.projectVersion=1.1
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=tests,AI Call Center Platform/src/app/__tests__,AI Call Center Platform/src/app/hooks/__tests__
sonar.inclusions=app/**,scripts/**,deploy/**,AI Call Center Platform/src/**,run_smoke_test.py,setup_admin.py,Dockerfile,docker-compose.yml,docker-compose.prod.yml,docker-compose.sonarqube.yml,run_platform.bat,start_public_tunnel.bat

sonar.exclusions=**/.git/**,**/.specify/**,**/.agents/**,**/.docker/**,**/.docker_scan_tmp/**,**/.runtime/**,**/node_modules/**,**/.pytest_cache/**,**/dist/**,**/build/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/*.pyc,**/*.bin,**/*.txt,**/*.csv,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.webp,**/*.mp3,**/*.wav,**/*.ogg,**/*.flac,**/*.m4a,**/*.webm,**/uploads/**,**/local_chroma_db/**,**/scratch/**,specs/**,docs/**,alembic/**,**/__tests__/**/*.cjs,**/__tests__/**/*.ts,**/__tests__/**/*.tsx
sonar.test.inclusions=tests/**/*.py,AI Call Center Platform/src/**/__tests__/**/*.ts,AI Call Center Platform/src/**/__tests__/**/*.tsx

sonar.python.version=3.11
sonar.python.file.suffixes=.py
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx
sonar.typescript.tsconfigPaths=AI Call Center Platform/tsconfig.sonar.json
sonar.python.coverage.reportPaths=.runtime/coverage/python-coverage.xml
sonar.javascript.lcov.reportPaths=.runtime/coverage/frontend-lcov.info

sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.e1.resourceKey=AI Call Center Platform/src/styles/*.css
