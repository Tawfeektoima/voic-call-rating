<!DOCTYPE html>
<html>
<head>
  <title>VoiceQA Live</title>
  <!-- Required for getUserMedia in popup context -->
  <meta http-equiv="Permissions-Policy" content="microphone=*">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f0f14;
      color: #e2e8f0;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .header .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #818cf8;
      box-shadow: 0 0 8px #818cf880;
    }
    .header h2 {
      font-size: 15px;
      color: #c7d2fe;
      font-weight: 600;
    }

    /* Screens */
    .screen { display: none; }
    .screen.active { display: block; }

    /* Form fields */
    .field { margin-bottom: 10px; }
    label {
      display: block;
      font-size: 10px;
      color: #64748b;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 9px 11px;
      background: #1a1a2e;
      border: 1px solid #2d2d44;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 12.5px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus { border-color: #818cf8; }
    input::placeholder { color: #475569; }

    /* Buttons */
    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: white;
    }
    .btn-danger {
      background: #dc2626;
      color: white;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #334155;
      color: #94a3b8;
    }

    /* Status bar */
    .status-bar {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 11px;
      text-align: center;
      display: none;
    }
    .status-bar.show { display: block; }
    .status-ok   { background: #064e3b; color: #6ee7b7; }
    .status-err  { background: #450a0a; color: #fca5a5; }
    .status-warn { background: #422006; color: #fdba74; }
    .status-load { background: #1e1b4b; color: #a5b4fc; }

    /* Live indicator */
    .live-panel {
      background: #1a1a2e;
      border: 1px solid #2d2d44;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      margin-bottom: 12px;
    }
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #dc2626;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 10px;
    }
    .live-badge .pulse {
      width: 8px; height: 8px;
      background: white;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .timer {
      font-size: 28px;
      font-weight: 300;
      color: #e2e8f0;
      font-variant-numeric: tabular-nums;
      margin: 6px 0;
    }
    .session-info {
      font-size: 10px;
      color: #64748b;
      word-break: break-all;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* User badge */
    .user-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: #1a1a2e;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 11px;
    }
    .user-bar .name { color: #a5b4fc; font-weight: 600; }
    .user-bar .logout {
      color: #64748b;
      cursor: pointer;
      font-size: 10px;
    }
    .user-bar .logout:hover { color: #f87171; }
  </style>
</head>
<body>

  <!-- ================================================================ -->
  <!-- SCREEN 1: Login -->
  <!-- ================================================================ -->
  <div id="screen-login" class="screen active">
    <div class="header">
      <div class="dot"></div>
      <h2>VoiceQA Agent Login</h2>
    </div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="agent@company.com" />
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password" />
    </div>

    <button class="btn btn-primary" id="btn-login">Login & Start Session</button>

    <div class="status-bar" id="login-status"></div>
  </div>

  <!-- ================================================================ -->
  <!-- SCREEN 2: Start Session (already logged in) -->
  <!-- ================================================================ -->
  <div id="screen-start" class="screen">
    <div class="header">
      <div class="dot"></div>
      <h2>VoiceQA Live</h2>
    </div>

    <div class="user-bar">
      <span class="name" id="user-name">Agent</span>
      <span class="logout" id="btn-logout">Logout</span>
    </div>

    <div class="field">
      <label>Campaign</label>
      <select id="campaign-select">
        <option value="1">Default Campaign</option>
      </select>
    </div>

    <button class="btn btn-primary" id="btn-start">Start New Session</button>

    <div class="status-bar" id="start-status"></div>
  </div>

  <!-- ================================================================ -->
  <!-- SCREEN 3: Live Session -->
  <!-- ================================================================ -->
  <div id="screen-live" class="screen">
    <div class="header">
      <div class="dot" style="background:#ef4444; box-shadow:0 0 8px #ef444480;"></div>
      <h2>Session Active</h2>
    </div>

    <div class="live-panel">
      <div class="live-badge"><div class="pulse"></div> LIVE</div>
      <div class="timer" id="timer">00:00</div>
      <div class="session-info" id="live-session-id"></div>
    </div>

    <button class="btn btn-danger" id="btn-stop">End Session</button>

    <div class="status-bar" id="live-status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
